# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-webrequest-hook-plugin"
version = "1.5.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.87"
description = "First-party signed kind:hook plugin cdylib: a transparent HTTP forwarder that POSTs each hook op envelope (decide/transform/notify/configure/describe/status) to an operator-configured URL and returns the capped JSON reply. The migration path for the retired socket/webhook hook transport and the isolation path for untrusted hook logic (run it remotely behind this trusted dlopen'd forwarder). Owns its own reqwest client; applies its own SSRF guard on the configured URL."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib for the C ABI delivery; rlib so the unit tests can exercise the pure helpers

[dependencies]
# INTERIM: busbarAI isn't public yet, so this is a local path dependency into a sibling checkout of
# the monorepo. Once busbarAI ships publicly this should become a git (pinned rev/tag) or crates.io
# dependency instead — same pattern being applied to headroom-hook's busbar-plugin-sdk dependency.
busbar-plugin-sdk = { path = "../busbarAI/crates/plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The plugin owns the web call: its own async runtime + HTTP client. redirect::none is set on the
# client so a target cannot 30x-redirect us to an internal host at runtime. Production code only ever
# builds a `new_current_thread()` runtime (see `Forwarder::new`), so `rt-multi-thread` is NOT listed
# here — it would otherwise ship in the shipped release cdylib for no reason. It's still available to
# `cargo test` (via the `[dev-dependencies]` copy below, which Cargo unifies with this one for any
# build that includes dev-dependencies): `src/tests.rs`'s `drop_in_async_context_does_not_panic` test
# needs a real multi-thread runtime to reproduce the hot-reload drop-on-a-tokio-worker-thread case.
tokio = { version = "1", features = ["rt", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
# A local mock HTTP server for the end-to-end forward tests (mirrors the old webhook.rs test harness).
axum = { version = "0.8", features = ["http1"] }
# `rt-multi-thread` here (not in `[dependencies]`) is what makes it available to `cargo test` (see the
# comment on the `[dependencies]` tokio entry above) without shipping it in the release artifact.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
# INTERIM local path deps, same rationale as busbar-plugin-sdk above — these are dev-only (the
# end-to-end test loads the built cdylib over the real loader ABI seam), never shipped in the plugin
# artifact itself.
busbar-plugin-loader = { path = "../busbarAI/crates/plugin-loader" }
busbar-api = { path = "../busbarAI/crates/api" }
# For `tests/full_stack_e2e.rs`: signs the plugin tarball in-process exactly like the real release
# pipeline / `busbar-plugin-pack` does, so that test installs a GENUINELY signed artifact over the
# real admin API rather than relying on `allow_unsigned`.
busbar-plugin-sign = { path = "../busbarAI/crates/plugin-sign" }
# Encodes the signed tarball into the admin API's `tarball_b64` JSON field (same crate/version the
# engine's own admin tests use for the identical purpose).
base64 = "0.22"
# `full_stack_e2e.rs` drives the real admin + data-plane HTTP APIs with JSON bodies. The `json`
# feature is added HERE (not in `[dependencies]`'s reqwest, which stays JSON-free) — Cargo unifies
# the two entries for any build that includes dev-dependencies, so this never reaches the shipped
# release cdylib.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
