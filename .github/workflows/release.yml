# Release: on a version tag (e.g. v1.0.0), build the webrequest-hook plugin cdylib for all 5
# supported targets, pack + sign each into a loadable busbar plugin tarball, and publish them to
# THIS repo's own GitHub Release.
#
# This mirrors busbarAI/.github/workflows/release.yml's `auth-plugins` job (and the identical
# pattern GetBusbar/auth-oidc and GetBusbar/headroom-hook use) — same 5-target matrix, same
# busbar-plugin-pack pack/sign step (built from a sibling busbar checkout), same
# BUSBAR_SIGN_KEY-or-`--allow-unsigned` fallback, same `gh release upload` + build-provenance
# attestation — just scoped to this one plugin.
#
# REPLACES the old stopgap workflow, which only built and uploaded the UNSIGNED raw cdylib
# (busbar-plugin-pack lived only in the still-private busbarAI monorepo at the time, so
# packing/signing was a manual follow-up step against this workflow's artifacts). busbar-plugin-pack
# is built here from a sibling busbar checkout instead, exactly like every other first-party plugin
# repo, so this workflow now produces the real signed, loadable tarball directly.
#
# This plugin's own version (the `v*` tag pushed here) is NOT tied to busbar's version number —
# see other first-party plugin repos for the same convention.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # create the Release + upload assets
  id-token: write      # OIDC identity for keyless Sigstore signing (provenance)
  attestations: write  # record the build-provenance attestation

jobs:
  # Create the Release first so the parallel per-target upload jobs have something to attach to
  # (uploading from a matrix without a pre-existing release races -> "release not found").
  #
  # It is created as a DRAFT. A draft is addressable by tag to `gh release upload` / `gh release
  # view` with this token, but it is NOT returned by the public `releases/latest` or
  # `releases/tags/<tag>` endpoints -- so while the build matrix is still running, and for good if it
  # fails, nothing following `releases/latest` can observe an assetless release. `verify-assets`
  # publishes it only once assets are actually attached, which is what makes a release here either
  # complete or absent, never an empty shell.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release (draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "busbar-webrequest ${GITHUB_REF_NAME}" \
            --draft --verify-tag --generate-notes \
          || gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"

  # One signed .tar.gz per target: {cdylib + manifest.json}, packed by busbar-plugin-pack and
  # signed with the busbar release PRIVATE key (BUSBAR_SIGN_KEY secret) so it verifies as
  # first-party against the PUBLIC key embedded in busbar's own release binaries. If that secret
  # isn't provisioned on this repo, falls back to an UNSIGNED tarball (loadable only under
  # plugins.trust.allow_unsigned) rather than blocking the release — same seam every other
  # first-party plugin's release.yml documents.
  webrequest-plugin:
    needs: create-release
    name: webrequest-plugin (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            libext: so
            libprefix: lib
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            libext: so
            libprefix: lib
          - target: x86_64-apple-darwin
            os: macos-latest
            libext: dylib
            libprefix: lib
          - target: aarch64-apple-darwin
            os: macos-latest
            libext: dylib
            libprefix: lib
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            libext: dll
            libprefix: ""
    steps:
      - name: Checkout webrequest-hook
        uses: actions/checkout@v7
        with:
          path: webrequest-hook

      - name: Resolve busbar ref from .busbar-ref
        id: ref
        run: echo "sha=$(cut -d' ' -f1 webrequest-hook/.busbar-ref)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Checkout busbar (sibling path dependency)
        uses: actions/checkout@v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ steps.ref.outputs.sha }}
          path: busbarAI

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build the webrequest-hook plugin cdylib
        working-directory: webrequest-hook
        run: cargo build --release --locked --lib --target ${{ matrix.target }}
        shell: bash

      - name: Build busbar-plugin-pack (from the sibling busbar checkout)
        working-directory: busbarAI
        run: cargo build --release --target ${{ matrix.target }} -p busbar-plugin-pack
        shell: bash

      - name: Package + sign the plugin tarball
        env:
          BUSBAR_SIGN_KEY: ${{ secrets.BUSBAR_SIGN_KEY }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          outdir="plugin-dist"; mkdir -p "$outdir"
          pack="busbarAI/target/${target}/release/busbar-plugin-pack"
          [ -x "$pack" ] || pack="busbarAI/target/${target}/release/busbar-plugin-pack.exe"
          unsigned_flag=""
          if [ -z "${BUSBAR_SIGN_KEY:-}" ]; then
            echo "::warning::BUSBAR_SIGN_KEY secret is not provisioned — packaging an UNSIGNED plugin tarball (loadable only under plugins.trust.allow_unsigned). See busbarAI's release.yml TODO(release-keys) seam."
            unsigned_flag="--allow-unsigned"
          fi
          lib="webrequest-hook/target/${target}/release/${{ matrix.libprefix }}busbar_webrequest_hook_plugin.${{ matrix.libext }}"
          "$pack" pack \
            --lib "$lib" \
            --name "busbar-webrequest" --alias "webrequest" --kind hook \
            --version "$ver" --publisher busbar \
            --description "A transparent HTTP forwarder that POSTs each hook op envelope (decide/transform/notify/configure/describe/status) to an operator-configured URL and returns the capped JSON reply — a busbar first-party kind:hook plugin (dlopen cdylib)." \
            --license Apache-2.0 \
            --needs-prompt rw --needs-user ro \
            --out "${outdir}/busbar-webrequest-${ver}-${target}.tar.gz" \
            $unsigned_flag
          ls -l "$outdir"
        shell: bash

      - name: Attach plugin tarball to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" plugin-dist/*.tar.gz --repo "${GITHUB_REPOSITORY}" --clobber
        shell: bash

      # Keyless (Sigstore/OIDC) build-provenance attestation binding this tarball's digest to this
      # workflow run + commit — `gh attestation verify <tarball> --repo ${{ github.repository }}`.
      - name: Attest plugin build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "plugin-dist/*.tar.gz"

  # PHANTOM-RELEASE GATE: this is the only step that turns the draft into a published release, and it
  # does so only after proving assets are attached. The per-target build/upload jobs run with
  # fail-fast:false and `create-release` makes the (initially empty) Release up front, so a build/pack
  # failure on EVERY target (e.g. a stale Cargo.lock tripping `--locked`) leaves a Release with ZERO
  # assets. Previously that Release was published immediately and such a failure shipped a "phantom":
  # a tag whose `releases/latest` carried nothing, silently breaking busbar's plugin-registry-gate.
  # Now the empty Release is a draft nothing can resolve, and this job either publishes it or fails
  # the run with the draft left unpublished. It depends on the build matrix but does NOT inherit its
  # fail-fast:false: one green target is enough to have assets, zero across the board must hard-fail.
  verify-assets:
    needs: [webrequest-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Assert the Release has at least one asset, then publish it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count="$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets | length')"
          echo "Release ${GITHUB_REF_NAME} has ${count} asset(s)."
          if [ "${count}" -eq 0 ]; then
            echo "::error::PHANTOM RELEASE PREVENTED: ${GITHUB_REF_NAME} has 0 assets." \
                 "Every build/pack target failed to upload a tarball. The release is still a DRAFT," \
                 "so it was never visible to anything following releases/latest and there is no" \
                 "phantom to clean up -- just fix the build (check Cargo.lock freshness vs --locked" \
                 "and the plugin cdylib build step) and re-run. Failing the release run." >&2
            exit 1
          fi
          # Only now, with assets provably attached, does this stop being a draft and become the
          # release that `releases/latest` resolves to.
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false --latest
          echo "::notice::Published ${GITHUB_REF_NAME} with ${count} asset(s)."

  # Instant marketing-site rebuild the moment this plugin ships a real release -- marketing's
  # deploy.yml listens for this exact repository_dispatch event type (plus its own daily-poll
  # fallback, so a missed/failed dispatch here is never a permanent gap). Same RELEASE_DISPATCH_TOKEN
  # pattern busbar core's own release.yml uses for its downstream fan-out -- see that file's
  # notify-downstream job for the template this mirrors. Fails loud (not a silent no-op) if the
  # secret isn't provisioned, so a missing secret can't masquerade as "nothing to notify."
  notify-marketing:
    needs: [webrequest-plugin, verify-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch upstream-release to the marketing site
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_DISPATCH_TOKEN is not provisioned on this repo -- cannot notify" \
                 "marketing instantly. marketing's own daily poll will still pick this release up" \
                 "within 24h (self-healing fallback intact)." >&2
            exit 1
          fi
          gh api "repos/GetBusbar/marketing/dispatches" \
            -f event_type=upstream-release \
            -f "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${GITHUB_REF_NAME}"
