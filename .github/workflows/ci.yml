# Calls the canonical plugin-ci reusable workflow (GetBusbar/busbar/.github/workflows/plugin-ci.yml)
# instead of hand-copying build/test/signoff steps here — see that file for what actually runs.
# This also gets us the SIGNOFF stage the old hand-written ci.yml never had: packing the plugin with
# the real busbar-plugin-pack tool on every push, so a manifest/tarball packing regression is caught
# in CI rather than first discovered at release time.
name: ci

on:
  push:
    branches: [main, dev, qa]
  pull_request:
    branches: [main, dev, qa]

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@dev
    with:
      plugin_crate: busbar-webrequest-hook-plugin
      plugin_kind: hook
      plugin_alias: webrequest
      service: none
      busbar_ref: ${{ github.ref_name }} # same-branch: qa builds core qa, dev builds core dev (no stale main/tag)
