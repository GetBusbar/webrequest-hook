# Build, test, lint, and format-check the webrequest-hook plugin cdylib on every push/PR.
#
# NOTE: this crate depends on busbarAI (../busbarAI, a local path dependency — see the README's
# "Dependencies" section) which is not yet a public repo, so CI cannot check it out as a public
# dependency. Until busbarAI ships publicly, this workflow checks out both repos side by side using
# a deploy-key-scoped or org-token checkout of busbarAI. Update BUSBARAI_REF as the pinned busbarAI
# commit/branch this plugin builds against moves.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUSBARAI_REF: main

jobs:
  test:
    name: build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webrequest-hook
        uses: actions/checkout@v4
        with:
          path: webrequest-hook

      - name: Checkout busbarAI (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: GetBusbar/busbarAI
          ref: ${{ env.BUSBARAI_REF }}
          # TODO: busbarAI is private today — set the BUSBARAI_CHECKOUT_TOKEN repo secret to a
          # token/deploy-key with read access before enabling this job. Once busbarAI is public,
          # drop this token line entirely.
          token: ${{ secrets.BUSBARAI_CHECKOUT_TOKEN }}
          path: busbarAI

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo fmt --check
        working-directory: webrequest-hook
        run: cargo fmt --all -- --check

      - name: cargo build
        working-directory: webrequest-hook
        run: cargo build --all-targets

      - name: cargo clippy
        working-directory: webrequest-hook
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: webrequest-hook
        run: cargo test
